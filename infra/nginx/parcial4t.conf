# Host nginx site for the shared VPS: public TLS here (certbot), proxied to our Caddy gateway on loopback.
# Install: sed "s/__HOST__/<host>/g" infra/nginx/parcial4t.conf | sudo tee /etc/nginx/sites-available/parcial4t
#          sudo ln -s /etc/nginx/sites-available/parcial4t /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d <host>      # adds the 443 server + redirect, renewed by the existing certbot.timer
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    client_max_body_size 1m;

    location / {
        proxy_pass https://127.0.0.1:8443;
        # Caddy serves the site by host name with its internal CA on loopback only.
        proxy_ssl_server_name on;
        proxy_ssl_name __HOST__;
        proxy_ssl_verify off;
        proxy_set_header Host __HOST__;
        # Overwrite (never append) so clients cannot spoof their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SignalR WebSockets (/hubs/live)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_parcial4t;
        proxy_read_timeout 3600s;
    }
}

map $http_upgrade $connection_upgrade_parcial4t {
    default upgrade;
    ''      close;
}
