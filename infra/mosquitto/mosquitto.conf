listener 8883
protocol mqtt
cafile /run/secrets/ca.crt
certfile /run/secrets/mqtt_server.crt
keyfile /run/secrets/mqtt_server.key
require_certificate false
allow_anonymous false
password_file /run/secrets/mosquitto_passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
